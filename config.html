<!-- config.html version 1.1 — cancelar bloqueo pendiente -->

<style>
  :root { --paper: #f6f4ef; --ink: #1f2a24; --line: #c9c2b3; --accent: #2f5d50; --accent-soft: #e4ece8; --danger: #8a3b2b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Iowan Old Style', 'Georgia', serif; padding-bottom: 60px; }
  header { padding: 28px 20px 18px; border-bottom: 2px solid var(--ink); }

  .persona .fecha { font-size: 11.5px; color: #8a8375; }
  .persona button { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 700; padding: 9px 14px; border-radius: 5px; border: none; cursor: pointer; background: var(--accent); color: #fff; flex-shrink: 0; }
  .persona.aprobado-item .email { color: #5a5347; }
  .persona button.quitar { background: none; color: var(--danger); }
  .empty-state { font-family: -apple-system, sans-serif; font-size: 13px; color: #8a8375; text-align: center; padding: 20px 12px; border: 1px dashed var(--line); border-radius: 6px; }

</style>

function escHtml(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

const ESPECIALIDADES_BASE = [
  'Anestesiología','Cardiología','Cirugía cardíaca','Cirugía colorrectal','Cirugía general',
  'Cirugía ortopédica','Cirugía vascular','Gastroenterología','Ginecología','Hematología',

];

async function cargarCatalogo(nombreTabla, titulo, descripcion, inputId, listaId, statusId, opciones={}) {
  const { data, error } = await sb.from(nombreTabla).select('id,nombre,activa').order('nombre');
  const lista = document.getElementById(listaId);
  const status = document.getElementById(statusId);

  if (error) {
    lista.innerHTML = '<div class="empty-state">No se pudo cargar este catálogo: ' + escHtml(error.message) + '</div>';
    status.textContent = 'Si la tabla todavía no existe en Supabase, ejecutá el SQL de configuración preparado junto con este archivo.';
    return;
  }

  status.textContent = '';

  lista.innerHTML = (data || []).length
    ? data.map(item => `
      <div class="catalogo-item ${item.activa === false ? 'inactiva' : ''}">
        <span class="nombre">${escHtml(item.nombre)}</span>
        <span class="estado">${item.activa === false ? 'Inactiva' : 'Activa'}</span>
        <button data-catalogo-action="renombrar"
                data-tabla="${nombreTabla}"
                data-id="${item.id}"
                data-nombre="${escHtml(item.nombre)}">Renombrar</button>
        <button class="${item.activa === false ? '' : 'desactivar'}"
                data-catalogo-action="toggle"
                data-tabla="${nombreTabla}"
                data-id="${item.id}"
                data-activa="${item.activa !== false}">
          ${item.activa === false ? 'Activar' : 'Desactivar'}
        </button>
      </div>`).join('')
    : '<div class="empty-state">No hay elementos cargados todavía.</div>';

  lista.querySelectorAll('[data-catalogo-action="renombrar"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const actual = btn.dataset.nombre;
      const nuevo = prompt('Nuevo nombre:', actual);
      if (nuevo === null) return;

      const nombre = nuevo.trim();
      if (!nombre || nombre === actual) return;

      const { error } = await sb.from(nombreTabla)
        .update({ nombre })
        .eq('id', btn.dataset.id);

      if (error) {
        alert('No se pudo renombrar: ' + error.message);
        return;
      }

      cargarCatalogo(nombreTabla, titulo, descripcion, inputId, listaId, statusId, opciones);
    });
  });

  lista.querySelectorAll('[data-catalogo-action="toggle"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const activa = btn.dataset.activa === 'true';
      const accion = activa ? 'desactivar' : 'activar';

      if (!confirm(`¿Querés ${accion} este elemento?`)) return;

      const { error } = await sb.from(nombreTabla)
        .update({ activa: !activa })
        .eq('id', btn.dataset.id);

      if (error) {
        alert('No se pudo cambiar el estado: ' + error.message);
        return;
      }

      cargarCatalogo(nombreTabla, titulo, descripcion, inputId, listaId, statusId, opciones);
    });
  });
}

async function agregarCatalogo(nombreTabla, inputId, listaId, statusId, titulo, descripcion, opciones={}) {
  const input = document.getElementById(inputId);
  const nombre = input.value.trim();

  if (!nombre) {
    input.focus();
    return;
  }

  const { error } = await sb.from(nombreTabla).insert({
    nombre,
    activa: true
  });

  if (error) {
    alert('No se pudo agregar: ' + error.message);
    return;
  }

  input.value = '';

  await cargarCatalogo(
    nombreTabla,
    titulo,
    descripcion,
    inputId,
    listaId,
    statusId,
    opciones
  );
}

/* =========================================================
   MÉDICOS COLABORADORES

let ESPECIALIDADES = [];

function especialidadLabel(valor) {
  if (!valor) return '';

  const encontrada = ESPECIALIDADES.find(([v]) => v === String(valor));

  return encontrada ? encontrada[1] : valor;
}

function valorEspecialidadDesdeTexto(texto) {
  const t = (texto || '').trim();

  if (!t) return '';

  const encontrada = ESPECIALIDADES.find(
    ([, label]) => label.toLowerCase() === t.toLowerCase()
  );

  return encontrada ? encontrada[0] : t;
}

function fmtFecha(iso) {
  const d = new Date(iso);

  return d.toLocaleDateString('es-AR', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  }) + ' ' +
  d.toLocaleTimeString('es-AR', {
    hour: '2-digit',
    minute: '2-digit'
  });
}

let miId = null;

async function cargar() {
  const {
    data: { user }
  } = await sb.auth.getUser();

  if (!user) {
    window.location.href = 'index.html';
    return;
  }

  miId = user.id;

  const { data: miPerfil } = await sb.from('profiles')
    .select('es_admin')
    .eq('id', user.id)
    .single();

  if (!miPerfil || !miPerfil.es_admin) {
    main.innerHTML = `
      <div class="empty-state">
        Esta sección es solo para administradores del comité.
      </div>
    `;
    return;
  }

  const {
    data: perfiles,
    error
  } = await sb.from('profiles')
    .select('id, email, aprobado, bloqueado, created_at, es_admin')
    .order('created_at', { ascending: false });

  if (error) {
    main.innerHTML = `
      <div class="empty-state">
        Error al cargar: ${escHtml(error.message)}
      </div>
    `;
    return;
  }

  const { data: solicitudes } = await sb.from('solicitudes_admin')
    .select('*')
    .eq('estado', 'pendiente')
    .order('created_at', { ascending: false });

  const totalAdmins = perfiles.filter(p => p.es_admin).length;
  const pendientes = perfiles.filter(p => !p.aprobado && !p.bloqueado);
  const aprobados = perfiles.filter(p => p.aprobado && !p.bloqueado);
  const restringidos = perfiles.filter(p => p.bloqueado);

  let html = '';

  html += `
    <h2 class="section-title">
      Decisiones pendientes de confirmación (${solicitudes ? solicitudes.length : 0})
    </h2>
  `;

  if (!solicitudes || solicitudes.length === 0) {
    html += `
      <div class="empty-state">
        No hay decisiones esperando confirmación.
      </div>
    `;
  } else {
    const etiquetas = {
      hacer_admin: 'Hacer administrador a',
      quitar_admin: 'Quitar como administrador a',
      desvincular: 'Restringir el acceso de',
      restringir_acceso: 'Restringir el acceso de',
      reactivar_acceso: 'Reactivar el acceso de'
    };

    solicitudes.forEach(s => {
      const yaConfirme = (s.confirmaciones || []).includes(miId);
      const soyElProponente = s.propuesto_por === miId;

      html += `
        <div class="solicitud" data-id="${s.id}">
          <div class="titulo">
            ${escHtml(etiquetas[s.tipo] || s.tipo)}:
            ${escHtml(s.objetivo_email)}
          </div>

          <div class="detalle">
            Confirmaron ${(s.confirmaciones || []).length}
            de ${totalAdmins} administradores
          </div>
      `;

      if (soyElProponente) {
        html += `
          <div class="estado-espera">
            Vos la propusiste — esperando que confirmen los demás administradores.
          </div>
        `;
        if (s.tipo === 'restringir_acceso' || s.tipo === 'desvincular') {
          html += `
            <div class="btns">
              <button class="rechazar"
                      data-action="cancelar-solicitud"
                      data-id="${s.id}">
                Cancelar bloqueo
              </button>
            </div>
          `;
        }
      } else if (yaConfirme) {
        html += `
          <div class="estado-espera">
            Ya confirmaste — esperando a los demás administradores.
          </div>
        `;
      } else {
        html += `
          <div class="btns">
            <button class="confirmar"
                    data-action="confirmar-solicitud"
                    data-id="${s.id}">
              Confirmar
            </button>

            <button class="rechazar"
                    data-action="rechazar-solicitud"
                    data-id="${s.id}">
              Rechazar
            </button>
          </div>
        `;
      }

      html += '</div>';
    });
  }

  html += `
    <h2 class="section-title">
      Esperando aprobación (${pendientes.length})
    </h2>
  `;

  if (pendientes.length === 0) {
    html += `
      <div class="empty-state">
        No hay nadie esperando aprobación.
      </div>
    `;
  } else {
    pendientes.forEach(p => {

        const hoja =

        const filasValidas = filas.filter(f =>

        if (!filasValidas.length) {

        const {
          data: zonasActivas,
          error: errorZonas

          .select('nombre')
          .eq('activa', true);

        if (errorZonas) {

            'No se pudieron cargar las zonas: ' +
            errorZonas.message;
          return;
        }

        const zonasSet = new Set(
          (zonasActivas || []).map(
            z => String(z.nombre || '')

              .toLowerCase()
          )
        );

        const {
          data: especialidadesActivas,
          error: errorEsp

        if (errorEsp) {

        }

        const especialidadesPorNombre =

              e => [
                String(e.nombre || '')

                  .toLowerCase(),
                String(e.id)

          );

        const errores = [];

        filasValidas.forEach((fila, idx) => {

          const zona =
            String(fila['Zona'] || '').trim();

          if (!zona) {
            errores.push(
              `Fila ${idx + 2}: falta Zona.`
            );
          } else if (
            !zonasSet.has(zona.toLowerCase())
          ) {
            errores.push(
              `Fila ${idx + 2}: la Zona "${zona}" no existe o está inactiva.`
            );
          }

          const estado =
            String(
              fila[
                'Estado del médico (Activo/Inactivo)'
              ] || ''
            )
            .trim()
            .toLowerCase();

          const tipo =
            String(
              fila[
                'Tipo de colaboración (Consultor/Colaborador/No)'
              ] || ''
            )
            .trim()
            .toLowerCase();

          if (!['activo','inactivo'].includes(estado)) {
            errores.push(
              `Fila ${idx + 2}: Estado del médico debe ser Activo o Inactivo.`
            );
          }

          if (!['consultor','colaborador','no'].includes(tipo)) {
            errores.push(
              `Fila ${idx + 2}: Tipo de colaboración debe ser Consultor, Colaborador o No.`
            );
          }
        });

        if (errores.length) {
          statusEl.textContent =
            `Importación detenida: ${errores.length} error(es). No se creó ningún registro.`;

          alert(
            'Corregí el Excel antes de importar:\n\n' +
            errores.slice(0, 15).join('\n') +
            (
              errores.length > 15
                ? `\n... y ${errores.length - 15} error(es) más.`
                : ''
            )
          );

          return;
        }

        const confirmado = confirm(
          `Vas a importar ${filasValidas.length} fila(s). Cada una va a crear un registro NUEVO de Médico colaborador — no se va a modificar ni borrar ningún dato existente. ¿Confirmás la importación?`
        );

        if (!confirmado) {
          statusEl.textContent =
            'Importación cancelada.';
          return;
        }

        const {
          data: { user }
        } = await sb.auth.getUser();

        if (!user) {
          statusEl.textContent =
            'La sesión expiró. Volvé a iniciar sesión.';
          return;
        }

        const {
          data: existentes,
          error: errorExistentes
        } = await sb.from('registros_hlc31')
          .select('id, datos');

        if (errorExistentes) {
          statusEl.textContent =
            'No se pudo verificar la carga existente: ' +
            errorExistentes.message;
          return;
        }

        const normalizarClave = valor =>
          String(valor || '')
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');

        const claveMedico = fila => [
          fila['Apellido'],
          fila['Nombre'],
          fila['Localidad'],
          fila['Hospital / Sector (CEH)']
        ]
        .map(normalizarClave)
        .join('|');

        const clavesExistentes =
          new Set(
            (existentes || []).map(r => {
              const d = r.datos || {};

              return [
                d['900_11_Text_SanSerif'],
                d['900_10_Text_SanSerif'],
                d['900_19_Text_SanSerif'],
                d['hospital_sector_ceh']
              ]
              .map(normalizarClave)
              .join('|');
            })
          );

        let creados = 0;
        let yaExistian = 0;
        let saltadas =
          filas.length - filasValidas.length;

        for (const fila of filasValidas) {

          const clave = claveMedico(fila);

          if (clavesExistentes.has(clave)) {
            yaExistian++;
            continue;
          }

          const apellido =
            String(fila['Apellido'] || '').trim();

          const nombre =
            String(fila['Nombre'] || '').trim();

          const estadoVal =
            String(
              fila[

            ).trim();

          const tipoVal =

              fila[
                'Tipo de colaboración (Consultor/Colaborador/No)'

          const estadoNorm =
            estadoVal.toLowerCase();

          const tipoNorm =
            tipoVal.toLowerCase();

          const estado =
            estadoNorm === 'activo'
              ? 'Activo'
              : estadoNorm === 'inactivo'
                ? 'Inactivo'
                : '';

          const tipo_colaboracion =
            tipoNorm === 'consultor'
              ? 'Consultor'
              : tipoNorm === 'colaborador'
                ? 'Colaborador'
                : tipoNorm === 'no'
                  ? 'No'
                  : '';

          const datos = {

            '900_10_Text_SanSerif':
              nombre,

            '900_11_Text_SanSerif':
              apellido,

            '900_12_Text_SanSerif':
              String(

            '900_13_Text_SanSerif':
              String(
                fila['Teléfono móvil'] || ''
              ).trim(),

            '900_19_Text_SanSerif':
              String(
                fila['Localidad'] || ''
              ).trim(),

            '900_20_Text_SanSerif':
              String(
                fila['Provincia o estado'] || ''
              ).trim(),

            'sector_zona_ceh':
              String(
                fila['Zona'] || ''
              ).trim(),

            'hospital_sector_ceh':
              String(
                fila['Hospital / Sector (CEH)'] || ''
              ).trim(),

            '900_24_HLC_Skills':
              valorEspecialidadDesdeTexto(
                fila['Especialidad 1']
              ),

            '900_27_HLC_Skills':
              String(
                fila['Subespecialidad 1'] || ''
              ).trim(),

            '900_25_HLC_Skills':
              valorEspecialidadDesdeTexto(
                fila['Especialidad 2']
              ),

            '900_28_HLC_Skills':
              String(
                fila['Subespecialidad 2'] || ''
              ).trim(),

            '900_26_HLC_Skills':
              valorEspecialidadDesdeTexto(
                fila['Especialidad 3']
              ),

            '900_29_HLC_Skills':
              String(
                fila['Subespecialidad 3'] || ''
              ).trim(),

            '900_8_Text_MultiLine_SanSerif':
              String(
                fila['Comentarios'] || ''
              ).trim()
          };

          const { error } =
            await sb.from('registros_hlc31')
              .insert({
                autor_id: user.id,
                datos,
                estado,
                tipo_colaboracion,
                nombre_original:

          if (error) {

            console.error(

                error
              }
            );
          } else {
            creados++;

            clavesExistentes.add(clave);

        }

        statusEl.textContent =

async function aplicarAccion(tipo, objetivoId) {

  if (tipo === 'hacer_admin') {
    return sb.from('profiles')
      .update({ es_admin: true })
      .eq('id', objetivoId);
  }

  if (tipo === 'quitar_admin') {
    return sb.from('profiles')
      .update({ es_admin: false })
      .eq('id', objetivoId);
  }

  if (
    tipo === 'desvincular' ||
    tipo === 'restringir_acceso'
  ) {
    return sb.from('profiles')
      .update({
        bloqueado: true,
        aprobado: false
      })
      .eq('id', objetivoId);
  }

  if (tipo === 'reactivar_acceso') {
    return sb.from('profiles')
      .update({
        bloqueado: false,
        aprobado: true
      })
      .eq('id', objetivoId);
  }
}

async function proponerAccion(
  tipo,
  objetivoId,
  objetivoEmail
) {
  // Si ya existe una propuesta pendiente para este usuario, no creamos otra.
  // Si la propuesta fue hecha por otro administrador, este clic significa
  // justamente que el administrador actual quiere confirmar esa propuesta.
  const tiposCompatibles =
    (tipo === 'restringir_acceso' || tipo === 'desvincular')
      ? ['desvincular', 'restringir_acceso']
      : ['reactivar_acceso'];

  const { data: existente } = await sb.from('solicitudes_admin')
    .select('*')
    .in('tipo', tiposCompatibles)
    .eq('objetivo_id', objetivoId)
    .eq('estado', 'pendiente')
    .maybeSingle();

  if (existente) {
    const confirmaciones = existente.confirmaciones || [];

    // El administrador que ya confirmó no debe volver a confirmar ni generar otra solicitud.
    if (confirmaciones.includes(miId)) {
      alert('Ya confirmaste esta solicitud. Está pendiente de la confirmación de los demás administradores.');
      cargar();
      return;
    }

    // Si la propuso otro administrador, este botón funciona como confirmación.
    await confirmarSolicitud(existente.id);
    return;
  }

  // Verificaciones de estado antes de crear la solicitud.
  const { data: objetivo } = await sb.from('profiles')
    .select('id, aprobado, bloqueado')
    .eq('id', objetivoId)
    .single();

  if (!objetivo) {
    alert('No se encontró el usuario.');
    return;
  }

  if (
    (tipo === 'restringir_acceso' || tipo === 'desvincular') &&
    objetivo.bloqueado
  ) {
    alert('Este usuario ya tiene el acceso restringido.');
    cargar();
    return;
  }

  if (
    tipo === 'reactivar_acceso' &&
    !objetivo.bloqueado
  ) {
    alert('Este usuario no tiene el acceso restringido.');
    cargar();
    return;
  }

  const { data: admins } =
    await sb.from('profiles')
      .select('id')
      .eq('es_admin', true);

  const totalAdmins =
    (admins || []).length;

  if (totalAdmins <= 1) {

    const { error } =
      await aplicarAccion(
        tipo,
        objetivoId
      );

    if (error) {
      alert(
        'Error: ' +
        error.message
      );
    }

    cargar();
    return;
  }

  const { error } =
    await sb.from('solicitudes_admin')
      .insert({
        tipo,
        objetivo_id: objetivoId,
        objetivo_email: objetivoEmail,
        propuesto_por: miId,
        confirmaciones: [miId],
        estado: 'pendiente'
      });

  if (error) {
    alert(
      'Error: ' +
      error.message
    );
  }

  cargar();
}

async function confirmarSolicitud(id) {

  const {
    data: s,
    error: errLeer
  } = await sb.from('solicitudes_admin')
    .select('*')
    .eq('id', id)
    .single();

  if (errLeer || !s) {
    alert(
      'No se pudo leer la propuesta.'
    );
    return;
  }

  if (
    (s.confirmaciones || [])
      .includes(miId)
  ) {
    return;
  }

  const nuevasConf = [
    ...(s.confirmaciones || []),
    miId
  ];

  const { data: admins } =
    await sb.from('profiles')
      .select('id')
      .eq('es_admin', true);

  const totalAdmins =
    (admins || []).length;

  if (nuevasConf.length >= totalAdmins) {

    const {
      error: errAplicar
    } = await aplicarAccion(
      s.tipo,
      s.objetivo_id
    );

    if (errAplicar) {
      alert(
        'Error al aplicar el cambio: ' +
        errAplicar.message
      );
      return;
    }

    await sb.from('solicitudes_admin')
      .update({
        confirmaciones: nuevasConf,
        estado: 'aprobada',
        resuelto_at:
          new Date().toISOString()
      })
      .eq('id', id);

  } else {

    await sb.from('solicitudes_admin')
      .update({
        confirmaciones: nuevasConf
      })
      .eq('id', id);
  }

  cargar();
}

async function cancelarSolicitud(id) {

  const { data: s, error: errLeer } = await sb.from('solicitudes_admin')
    .select('id, tipo, propuesto_por, estado')
    .eq('id', id)
    .single();

  if (errLeer || !s) {
    alert('No se pudo leer la propuesta.');
    return;
  }

  if (s.propuesto_por !== miId) {
    alert('Solo puede cancelar esta propuesta el administrador que la creó.');
    return;
  }

  if (s.estado !== 'pendiente') {
    cargar();
    return;
  }

  if (s.tipo !== 'restringir_acceso' && s.tipo !== 'desvincular') {
    return;
  }

  if (!confirm('¿Cancelar el bloqueo propuesto? El usuario seguirá con su acceso sin cambios.')) {
    return;
  }

  const { error } = await sb.from('solicitudes_admin')
    .update({
      estado: 'cancelada',
      resuelto_at: new Date().toISOString()
    })
    .eq('id', id)
    .eq('propuesto_por', miId)
    .eq('estado', 'pendiente');

  if (error) {
    alert('No se pudo cancelar la propuesta: ' + error.message);
    return;
  }

  cargar();
}

async function rechazarSolicitud(id) {

  if (!confirm(
    '¿Rechazar esta propuesta? El acceso de la persona no cambiará.'
  )) {
    return;
  }

  await sb.from('solicitudes_admin')
    .update({
      estado: 'rechazada',
      resuelto_at:
        new Date().toISOString()
    })
    .eq('id', id);

  cargar();
}

cargar();
</script>
